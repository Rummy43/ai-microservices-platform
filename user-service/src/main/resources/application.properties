spring.application.name=user-service
spring.threads.virtual.enabled=true
server.port=8080

# Kafka Connection (env-driven for compose/K8s; defaults preserve local bootRun)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Avro Configuration
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# MySQL Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase settings
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

logging.level.liquibase=INFO
#logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Kubernetes-style liveness/readiness groups (/actuator/health/liveness|readiness) - Phase 8 probes
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s

management.info.env.enabled=true
info.app.name=user-service
info.app.description=Publishes user-created events to Kafka
info.app.version=1.0.0

logging.pattern.level=%5p [${spring.application.name:user-service},traceId:%X{traceId}]