server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              # route targets env-driven for compose/K8s; defaults preserve local bootRun
              uri: ${USER_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: userServiceCB
                    fallbackUri: forward:/fallback/users
                - name: Retry
                  args:
                    retries: 3
                    series: SERVER_ERROR
                    methods: GET

            - id: admin-route
              uri: ${USER_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: userServiceCB
                    fallbackUri: forward:/fallback/users

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: notificationServiceCB
                    fallbackUri: forward:/fallback/notifications
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match the `iss` claim in tokens (how clients reach Keycloak);
          # jwk-set-uri is where THIS gateway fetches signing keys. They diverge once the
          # gateway runs in a container network (iss = external URL, JWKS = internal DNS),
          # so both are independently overridable. Default derives JWKS from the issuer.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ai-microservices}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ai-microservices}/protocol/openid-connect/certs}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      userServiceCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      userServiceCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default
  ratelimiter:
    instances:
      public-api:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0
        registerHealthIndicator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      # Kubernetes-style liveness/readiness groups (/actuator/health/liveness|readiness) - Phase 8 probes
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s