# ClusterIP — bootstrap address used by all app services (KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: microservices
spec:
  selector:
    app: kafka
  ports:
  - name: client
    port: 9092
    targetPort: 9092
---
# Headless service — gives kafka-0 a stable FQDN for KRaft quorum voters config
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: microservices
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - name: controller
    port: 9093
    targetPort: 9093
