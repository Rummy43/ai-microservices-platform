apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
      # Hard dependency: Spring JPA fails to boot without the DB
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql 3306; do echo "waiting for mysql"; sleep 3; done']
      # Guard against ADR-018 blind spot: schema-registry cold-start takes 60-120s;
      # the outbox publisher marks rows FAILED permanently if it can't reach it at startup
      - name: wait-for-schema-registry
        image: busybox:1.36
        command: ['sh', '-c', 'until wget -q -O /dev/null http://schema-registry:8081/subjects; do echo "waiting for schema-registry"; sleep 5; done']
      containers:
      - name: user-service
        image: ai-platform/user-service:1.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: SCHEMA_REGISTRY_URL
          value: http://schema-registry:8081
        - name: DB_HOST
          value: mysql
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: user_db
        - name: DB_USERNAME
          value: root
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: mysql-root-password
        # OTel disabled for K8s session 1: host.docker.internal:4318 is unreachable from
        # kind pods on Windows WSL2. Session 2: remove this and set OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
        - name: OTEL_SDK_DISABLED
          value: "true"
        # startupProbe gives 600s (60×10) for Liquibase migrations + Kafka consumer init on WSL2
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 384Mi
            cpu: 1m
          limits:
            # 768Mi: Spring Boot + JPA + OTel agent + Avro + Liquibase peaks at 512-700MB on startup
            memory: 768Mi
            cpu: 500m
