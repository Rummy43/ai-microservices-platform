apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: microservices
spec:
  # Cold pull of llama3.2 (2 GB) + nomic-embed-text (500 MB) can take 30+ min on a slow connection.
  # On repeat apply the Job exists but won't re-run — models are cached in the ollama-data PVC.
  # To force a re-pull: kubectl delete job ollama-model-pull -n microservices && kubectl apply -k k8s/base
  activeDeadlineSeconds: 2400
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-ollama
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z ollama 11434; do echo "waiting for ollama"; sleep 5; done']
      containers:
      - name: pull-models
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_HOST
          value: http://ollama:11434
        command:
        - sh
        - -c
        - |
          echo "Pulling llama3.2..."
          ollama pull llama3.2
          echo "Pulling nomic-embed-text..."
          ollama pull nomic-embed-text
          echo "All models ready"
        resources:
          requests:
            memory: 64Mi
            cpu: 1m
          limits:
            memory: 256Mi
            cpu: 500m
