apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: microservices
  # Label required: ServiceMonitor matchLabels selects on SERVICE metadata labels.
  # Without this, the ServiceMonitor discovers nothing (same trap as app services — see session 5 notes).
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
  - name: metrics
    port: 9308
    targetPort: 9308