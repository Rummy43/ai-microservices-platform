apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices

resources:
- namespace.yaml
- secrets.yaml
# Infra — ordered: services before statefulsets so headless DNS is ready
- kafka/service.yaml
- kafka/statefulset.yaml
- schema-registry/deployment.yaml
- schema-registry/service.yaml
- mysql/statefulset.yaml
- mysql/service.yaml
- postgres/statefulset.yaml
- postgres/service.yaml
- keycloak/deployment.yaml
- keycloak/service.yaml
# Platform services
- user-service/deployment.yaml
- user-service/service.yaml
- user-service/servicemonitor.yaml
- notification-service/deployment.yaml
- notification-service/service.yaml
- notification-service/servicemonitor.yaml
- api-gateway/deployment.yaml
- api-gateway/service.yaml
- api-gateway/servicemonitor.yaml
# Broker-side consumer lag (closes ADR-017/018 blind spot deferred from Phase 7)
- kafka-exporter/deployment.yaml
- kafka-exporter/service.yaml
- kafka-exporter/servicemonitor.yaml
# Phase 7 SLO alert + recording rules as PrometheusRule CRD (Prometheus Operator picks up automatically)
- monitoring/prometheus-rules.yaml
# Phase 9 — AI service: Ollama LLM backend + ai-service (Spring AI 2.0 + PGVector)
# Note: Ollama requires Docker Desktop memory ≥ 8 GB (llama3.2 loads ~2.5 GB into RAM).
# model-pull-job runs once; on repeat apply the completed Job is left unchanged (models cached in PVC).
- ollama/statefulset.yaml
- ollama/service.yaml
- ollama/model-pull-job.yaml
- ai-service/deployment.yaml
- ai-service/service.yaml
- ai-service/servicemonitor.yaml

# Keycloak realm JSON mounted as a ConfigMap volume into the Keycloak pod.
# Source file copied from docker/keycloak/ai-microservices-realm.json — update both if realm changes.
configMapGenerator:
- name: keycloak-realm
  files:
  - keycloak/ai-microservices-realm.json

generatorOptions:
  disableNameSuffixHash: true
