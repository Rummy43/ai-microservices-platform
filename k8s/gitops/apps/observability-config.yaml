# Observability config — cluster-level K8s manifests that complement the Helm stack:
#   - gp3 StorageClass (EBS default for EKS PVCs)
#   - AlertmanagerConfig CR (routes platform alerts to SES email receiver)
#
# wave 0: StorageClass must exist before kube-prometheus-stack provisions PVCs.
# The alertmanager-smtp-secret is NOT managed here — it is generated by the
# Terraform observability module deploy script (contains SES SMTP credentials).
#
# Note: alertmanager-smtp-secret must be created manually before the first sync:
#   kubectl create secret generic alertmanager-smtp-secret -n monitoring \
#     --from-literal=smtp-password=<ses-smtp-secret-key>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Rummy43/ai-microservices-platform.git
    targetRevision: HEAD
    path: k8s/overlays/prod/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
  # alertmanager-smtp-secret is managed outside ArgoCD — ignore its absence
  - group: ""
    kind: Secret
    name: alertmanager-smtp-secret
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
