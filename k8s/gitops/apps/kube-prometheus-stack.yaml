# kube-prometheus-stack — Prometheus Operator + Grafana + Alertmanager
# wave 0: observability layer must be ready before platform services are deployed
#
# Uses ArgoCD multi-source (requires ArgoCD 2.6+):
#   source 1 — Helm chart from prometheus-community repo
#   source 2 — values files from this Git repo ($values ref)
#
# ServerSideApply is required: kube-prometheus-stack CRDs exceed the 256KB
# kubectl apply annotation limit without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.8.0"
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
      - $values/k8s/helm/kube-prometheus-stack/values.yaml
      - $values/k8s/helm/kube-prometheus-stack/values-eks.yaml
  - repoURL: https://github.com/Rummy43/ai-microservices-platform.git
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
