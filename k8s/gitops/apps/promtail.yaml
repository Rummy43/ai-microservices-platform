# Grafana Promtail — log shipping DaemonSet (scrapes node logs → Loki)
# wave 1: Loki must be Running before Promtail starts shipping (dependency on wave 0)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: "6.15.5"
    helm:
      releaseName: promtail
      valueFiles:
      - $values/k8s/helm/promtail/values.yaml
  - repoURL: https://github.com/Rummy43/ai-microservices-platform.git
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
