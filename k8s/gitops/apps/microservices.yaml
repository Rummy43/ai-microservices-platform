# Platform microservices — Kustomize prod overlay
# wave 2: depends on observability stack (wave 0) and StorageClass (wave 0)
#
# ArgoCD auto-detects Kustomize via kustomization.yaml in the source path.
# The configMapGenerator (keycloak realm) is handled by ArgoCD's built-in Kustomize.
#
# Image tags are pinned in the overlay deployment manifests (ECR URIs with :x.y.z tags).
# To promote a new image: update the image tag in the relevant deployment.yaml and push —
# ArgoCD detects the diff and triggers a rolling update automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Rummy43/ai-microservices-platform.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
