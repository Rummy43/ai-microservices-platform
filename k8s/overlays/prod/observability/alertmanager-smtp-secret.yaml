# PLACEHOLDER — do NOT commit real credentials.
# At deploy time, replace this file with:
#
#   kubectl create secret generic alertmanager-smtp-secret \
#     --namespace monitoring \
#     --from-literal=smtp-username=$(terraform -chdir=terraform output -raw ses_smtp_username) \
#     --from-literal=smtp-password=$(terraform -chdir=terraform output -raw ses_smtp_password) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The values come from terraform/modules/observability outputs (ses_smtp_username,
# ses_smtp_password). See outputs.deploy_instructions for the full deploy sequence.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp-secret
  namespace: monitoring
type: Opaque
stringData:
  smtp-username: "REPLACE_WITH_TERRAFORM_OUTPUT"
  smtp-password: "REPLACE_WITH_TERRAFORM_OUTPUT"
