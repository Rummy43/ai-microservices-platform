apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      # Create keycloak_db if it doesn't exist — RDS only provisions notificationdb by default
      - name: create-keycloak-db
        image: postgres:17-alpine
        command: [sh, -c, 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d postgres -tc "SELECT 1 FROM pg_database WHERE datname=''keycloak_db''" | grep -q 1 && echo "keycloak_db exists" || (PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d postgres -c "CREATE DATABASE keycloak_db" && echo "keycloak_db created")']
        env:
        - name: DB_HOST
          value: ai-platform-prod-postgres.cifqagsacu3i.us-east-1.rds.amazonaws.com
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-password
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.2
        args: ['start-dev', '--import-realm']
        ports:
        - containerPort: 8080
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: keycloak-admin-password
        - name: KC_HOSTNAME
          value: keycloak
        - name: KC_HOSTNAME_PORT
          value: "8080"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        # Switch from ephemeral H2 to RDS PostgreSQL
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: ai-platform-prod-postgres.cifqagsacu3i.us-east-1.rds.amazonaws.com
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: keycloak_db
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-password
        startupProbe:
          httpGet:
            path: /realms/ai-microservices
            port: 8080
          periodSeconds: 15
          failureThreshold: 120
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /realms/ai-microservices
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 1000m
        volumeMounts:
        - name: realm-config
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: realm-config
        configMap:
          name: keycloak-realm
