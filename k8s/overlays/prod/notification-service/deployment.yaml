apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: kafka-client-sa
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z ai-platform-prod-postgres.cifqagsacu3i.us-east-1.rds.amazonaws.com 5432; do echo "waiting for RDS PostgreSQL"; sleep 5; done']
      containers:
      - name: notification-service
        image: 922024167800.dkr.ecr.us-east-1.amazonaws.com/ai-platform/notification-service:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: DB_HOST
          value: ai-platform-prod-postgres.cifqagsacu3i.us-east-1.rds.amazonaws.com
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: notificationdb
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: db-password
        - name: AI_SERVICE_URL
          value: http://ai-service:8083
        - name: SCHEMA_REGISTRY_URL
          value: http://schema-registry:8081
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: "optional:file:/config/"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 768Mi
            cpu: 500m
        volumeMounts:
        - name: prod-config
          mountPath: /config
          readOnly: true
      volumes:
      - name: prod-config
        configMap:
          name: notification-service-prod-config
