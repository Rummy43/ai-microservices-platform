apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices

resources:
- namespace.yaml
- secrets.yaml
- serviceaccounts.yaml
# Schema Registry — self-managed on EKS, pointing to MSK Serverless
- schema-registry/ensure-configmap.yaml
- schema-registry/deployment.yaml
- schema-registry/service.yaml
# Keycloak — start-dev + RDS PostgreSQL backend
- keycloak/deployment.yaml
- keycloak/service.yaml
# Platform services — ECR images, RDS/MSK endpoints
- user-service/kafka-configmap.yaml
- user-service/deployment.yaml
- user-service/service.yaml
- user-service/servicemonitor.yaml
- notification-service/kafka-configmap.yaml
- notification-service/deployment.yaml
- notification-service/service.yaml
- notification-service/servicemonitor.yaml
- api-gateway/deployment.yaml
- api-gateway/service.yaml
- api-gateway/servicemonitor.yaml
- api-gateway/ingress.yaml
- monitoring/prometheus-rules.yaml

configMapGenerator:
- name: keycloak-realm
  files:
  - keycloak/ai-microservices-realm.json

generatorOptions:
  disableNameSuffixHash: true
