apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-client-sa
  namespace: microservices
  annotations:
    # IRSA: pods using this SA get AWS credentials via OIDC token exchange.
    # Role ai-platform-kafka-client allows kafka-cluster:* on MSK Serverless.
    eks.amazonaws.com/role-arn: arn:aws:iam::922024167800:role/ai-platform-kafka-client
