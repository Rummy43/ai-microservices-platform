# kube-prometheus-stack — EKS overlay
# Usage: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#          --namespace monitoring --create-namespace \
#          -f values.yaml -f values-eks.yaml
#
# Changes vs. the kind values.yaml:
#   1. StorageClass: standard → gp3 (EBS-backed, EKS default provisioner)
#   2. Prometheus retention: 24h → 7d (S3 isn't used here; EBS gives us more room)
#   3. Alertmanager: real SES SMTP receiver replaces the webhook-only routing
#   4. Resources: bumped for t3.medium nodes (4 vCPU / 8GB each, 2 nodes)

# EKS control-plane components ARE accessible — re-enable what kind disabled
kubeProxy:
  enabled: true
kubeScheduler:
  enabled: true
kubeControllerManager:
  enabled: true
kubeEtcd:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 7d
    enableRemoteWriteReceiver: true
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 100m
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 5m
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    # Mount the SES SMTP secret (created by: kubectl create secret generic
    # alertmanager-smtp-secret -n monitoring --from-literal=smtp-username=...
    # --from-literal=smtp-password=... )
    volumes:
      - name: smtp-secret
        secret:
          secretName: alertmanager-smtp-secret
    volumeMounts:
      - name: smtp-secret
        mountPath: /etc/alertmanager/smtp
        readOnly: true

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "email-smtp.us-east-1.amazonaws.com:587"
      smtp_from: "yara.ramesh92@gmail.com"
      smtp_require_tls: true
      # Credentials read from mounted secret — not hardcoded in git
      smtp_auth_username_file: /etc/alertmanager/smtp/smtp-username
      smtp_auth_password_file: /etc/alertmanager/smtp/smtp-password

    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ses-email
      routes:
        # Critical / page severity → immediate email
        - matchers:
            - severity =~ "critical|page"
          receiver: ses-email
          group_wait: 10s
          repeat_interval: 1h
        # Warn severity → email with longer repeat
        - matchers:
            - severity = "warn"
          receiver: ses-email
          repeat_interval: 6h

    receivers:
      - name: ses-email
        email_configs:
          - to: "yara.ramesh92@gmail.com"
            send_resolved: true
            headers:
              subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .CommonLabels.severity }}'

    inhibit_rules:
      # Suppress warn-level alerts when a critical alert is already firing for the same system
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warn"
        equal: ["alertname"]

grafana:
  enabled: true
  adminPassword: admin
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  # Datasource config inherited from base values.yaml (Tempo + Loki URLs are the same)

# EKS node exporter — slightly more headroom on real nodes
prometheus-node-exporter:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      memory: 128Mi
      cpu: 10m
    limits:
      memory: 256Mi

prometheusOperator:
  resources:
    requests:
      memory: 128Mi
      cpu: 10m
    limits:
      memory: 256Mi
