services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # 9092 = host/bootRun clients; 29092 = intra-container (schema-registry, services)
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    # Guards service startup: Schema Registry takes 60-120s after Kafka is ready.
    # Without this gate the outbox publisher hits Avro serialization errors and marks
    # rows FAILED permanently — the ADR-018 blind spot we found on 2026-07-16.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Databases ────────────────────────────────────────────────────────────────
  # Host ports are offset (3307/5433) to avoid collision with the local Windows
  # MySQL80 (3306) and PostgreSQL (5432) services. Container-internal ports are
  # unchanged (3306/5432) — service containers connect over the Docker network.

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 forces TCP; 'localhost' would try the Unix socket which may not
      # be ready at the moment the check fires even after mysqld is accepting connections.
      # start_period: 120s covers cold-init (InnoDB init + schema bootstrap ~ 90s on first start)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  postgres:
    # pgvector/pgvector:pg17 is a drop-in for postgres:17 with the vector extension
    # pre-installed — required for the ai-service PGVector store (Flyway V1 does
    # CREATE EXTENSION vector which needs the extension available at the OS level).
    image: pgvector/pgvector:pg17
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: notification_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates ai_db on first start from an empty volume only.
      # Existing volumes: docker exec postgres psql -U postgres -c "CREATE DATABASE ai_db;"
      - ./postgres/init-ai-db.sql:/docker-entrypoint-initdb.d/01-init-ai-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── Observability stack ───────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      # Named volumes shared with service containers; replaces the previous host
      # bind-mounts (../service/logs) now that services run inside containers and
      # write JSON logs to /app/logs inside each container (logback FILE_JSON appender).
      - user-service-logs:/var/log/user-service:ro
      - notification-service-logs:/var/log/notification-service:ro
      - ai-service-logs:/var/log/ai-service:ro
    command: -config.file=/etc/promtail/promtail-config.yml

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # Realm as code: start-dev keeps state in the container FS, so any recreate
      # wipes the hand-built realm (bit us 2026-07-17). --import-realm only imports
      # when the realm does not already exist — safe on every start.
      - ./keycloak:/opt/keycloak/data/import:ro
    command:
      - start-dev
      - --import-realm

  # ── AI / LLM backend ──────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ollama list connects to the local server; fails if the server isn't up yet
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  ollama-init:
    # Pulls the required models into the shared ollama-data volume once the server
    # is healthy. ollama pull is idempotent — fast on subsequent compose-ups when
    # models are already cached. restart: "no" means it runs once per compose-up.
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["sh", "-c", "ollama pull llama3.2 && ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Platform services ─────────────────────────────────────────────────────────
  # OTel endpoint (http://tempo:4318, HTTP/protobuf) is baked into each image
  # via ENV in the Dockerfile — no override needed here.
  # Service names resolve via Docker's embedded DNS within the compose network.

  user-service:
    image: ai-platform/user-service:1.6.0
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: user_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - user-service-logs:/app/logs
    restart: on-failure

  notification-service:
    image: ai-platform/notification-service:1.6.0
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - notification-service-logs:/app/logs
    restart: on-failure

  api-gateway:
    image: ai-platform/api-gateway:1.6.0
    container_name: api-gateway
    ports:
      - "8082:8082"
    environment:
      USER_SERVICE_URI: http://user-service:8080
      NOTIFICATION_SERVICE_URI: http://notification-service:8081
      # issuer-uri = external URL (must match the `iss` claim in tokens issued by
      # the host-mapped Keycloak on localhost:8180).
      # jwk-set-uri = internal Docker DNS (gateway fetches signing keys over the
      # container network — the issuer/JWKS split designed on 2026-08-05).
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ai-microservices
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ai-microservices/protocol/openid-connect/certs
    depends_on:
      - user-service
      - notification-service
      - keycloak
    restart: on-failure

  ai-service:
    image: ai-platform/ai-service:1.0.0
    container_name: ai-service
    ports:
      - "8083:8083"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ai-service-logs:/app/logs
    restart: on-failure

volumes:
  mysql-data:
  postgres-data:
  ollama-data:
  user-service-logs:
  notification-service-logs:
  ai-service-logs: